# ===================================================================
# CONFIGURATION GENERALE
# ===================================================================

spring.application.name=gestion_projet_collaborative
server.port=${PORT:8080}


# ===================================================================
# CONNEXION MARIADB / MYSQL
# ===================================================================
spring.datasource.url=jdbc:mariadb://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:gestion_projet_collaborative}?disableGssApiAuth=true
spring.datasource.username=${MYSQLUSER:Admin}
spring.datasource.password=${MYSQLPASSWORD:6611}

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


# ===================================================================
# JPA / HIBERNATE
# ===================================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Hibernate détecte automatiquement MariaDB
# Pas besoin de :
# spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


# ===================================================================
# JWT
# ===================================================================

app.jwt.secret=${JWT_SECRET:5mJ#92LsQx8!tP4vR@2026GestionProjetCollab$Secure}

app.jwt.expiration-ms=86400000


# ===================================================================
# SWAGGER
# ===================================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs


# ===================================================================
# MAIL (SMTP) - notifications d'affectation a un projet
# ===================================================================
# Par defaut : Gmail SMTP (necessite un mot de passe d'application Google,
# pas le mot de passe du compte). Surchargeable via MAIL_HOST/MAIL_PORT si
# un autre fournisseur est utilise (SendGrid, Brevo, Mailtrap en test...).

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Adresse affichee comme expediteur, et URL de la plateforme inseree dans
# le bouton de l'e-mail de notification (front Vercel en prod).
app.mail.from=${MAIL_FROM:no-reply@workpulse.app}
app.mail.frontend-url=${FRONTEND_URL:http://localhost:5173}