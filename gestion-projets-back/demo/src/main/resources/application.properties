# ===================================================================
# CONFIGURATION GENERALE DE L'APPLICATION
# ===================================================================
spring.application.name=gestion_projet_collaborative
server.port=${PORT:8080}

# ===================================================================
# CONNEXION A LA BASE DE DONNEES MARIADB
# ===================================================================
spring.datasource.url=jdbc:mariadb://localhost:3306/gestion_projet_collaborative?disableGssApiAuth=true
spring.datasource.username=Admin
spring.datasource.password=6611
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===================================================================
# CONFIGURATION JPA / HIBERNATE
# ===================================================================
# Temporairement mis sur "create" pour forcer la creation initiale des tables.
# Une fois les tables visibles dans MariaDB, tu pourras remettre "update".
# Change "create" par "update" maintenant que la base est initialisée
spring.jpa.hibernate.ddl-auto=update

# Affiche les requetes SQL generees dans la console (tres utile pour debugger)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactive car Hibernate 6 (Spring Boot 3) detecte automatiquement MariaDB. 
# Le laisser actif provoquait un conflit bloquant la generation des tables.
# spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ===================================================================
# CONFIGURATION JWT (cle secrete + duree de validite du token)
# ===================================================================
app.jwt.secret=ChangeCetteCleSecreteAvantLaProductionElleDoitEtreLongueEtAleatoire123456789
app.jwt.expiration-ms=86400000

# ===================================================================
# SWAGGER / OPENAPI (documentation interactive de l'API)
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ===================================================================
# GESTION DES ERREURS (reponses JSON propres, pas de page Whitelabel/HTML)
# ===================================================================
# Force Spring MVC a lever NoHandlerFoundException pour une route inconnue
# (au lieu de la page d'erreur Whitelabel par defaut). GlobalExceptionHandler
# intercepte alors cette exception pour renvoyer un 404 au format JSON.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
# Empeche Spring Boot d'exposer message/stacktrace bruts sur /error si jamais
# cette route par defaut est atteinte (filet de securite supplementaire).
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false