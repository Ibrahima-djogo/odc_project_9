# ===================================================================
# CONFIGURATION GENERALE
# ===================================================================

spring.application.name=gestion_projet_collaborative
server.port=${PORT:8080}


# ===================================================================
# CONNEXION MARIADB / MYSQL
# ===================================================================
spring.datasource.url=jdbc:mariadb://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:gestion_projet_collaborative}?disableGssApiAuth=true
spring.datasource.username=${MYSQLUSER:Admin}
spring.datasource.password=${MYSQLPASSWORD:6611}

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


# ===================================================================
# JPA / HIBERNATE
# ===================================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# Hibernate détecte automatiquement MariaDB
# Pas besoin de :
# spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


# ===================================================================
# JWT
# ===================================================================

app.jwt.secret=${JWT_SECRET:5mJ#92LsQx8!tP4vR@2026GestionProjetCollab$Secure}

app.jwt.expiration-ms=86400000


# ===================================================================
# SWAGGER
# ===================================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs


# ===================================================================
# MAIL (API HTTP Resend) - notifications d'affectation et d'invitation
# ===================================================================

resend.api.key=${RESEND_API_KEY:}
resend.mail.from=${MAIL_FROM:onboarding@resend.dev}

app.mail.frontend-url=${FRONTEND_URL:http://localhost:5173}